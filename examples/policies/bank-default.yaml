# Example policy for a bank's credit environment. Adapt it to your own rules;
# InfoSec and compliance own the real one. The same file works in R and Python:
#   Python: credgate.Policy.load("bank-default.yaml")
#   R:      cg_policy("bank-default.yaml")
#
# Rules are tried in order; the first that matches an identifier decides
# what happens to it. Any `block` stops the whole request.

policy: credgate-policy
version: 1
id: bank-default
revision: 1
description: >
  Models inside the organisation may see customer data; frontier models may
  not. Card verification codes never leave the machine.

# The endpoints InfoSec has set up. The tier says where the data ends up:
#   local     models on the analyst's own machine (Ollama, vLLM, SGLang)
#   internal  models the bank runs itself (open models on vLLM or SGLang in
#             the data centre, behind the bank's gateway)
#   frontier  external providers (Claude, OpenAI, Gemini) - also when reached
#             through the bank's own gateway, since the data reaches them
# `blocked: true` keeps an endpoint on record but refuses every request to it.
# An endpoint that is not listed here receives nothing.
destinations:
  ollama-local:
    tier: local
    provider: ollama
    url: http://localhost:11434/v1
    description: Ollama on the analyst's machine
  vllm-gpu:
    tier: internal
    provider: vllm
    url: https://llm.bank.internal/v1
    description: shared vLLM server in the data centre (open models)
  sglang-gpu:
    tier: internal
    provider: sglang
    url: https://sglang.bank.internal/v1
  claude:
    tier: frontier
    provider: anthropic
    url: https://ai-gateway.bank.internal/anthropic
    description: Claude through the bank's gateway; limited, approved use only
  gemini:
    tier: frontier
    provider: google
    url: https://ai-gateway.bank.internal/gemini
  copilot:
    tier: frontier
    provider: github
    blocked: true
    description: not approved for credit data

# Matches below this confidence are ignored (for example an order number that
# passes the Aadhaar checksum by chance scores 0.42).
min_confidence: 0.5

rules:
  # PCI: a card number with its CVV and expiry must never reach a frontier
  # model - block the request rather than send any of it.
  - id: card-with-cvv-and-expiry
    when: {tiers: [frontier], all_of: [card, card_cvv, card_expiry]}
    action: block

  # Card verification codes are never needed by a model, wherever it runs.
  - id: cvv-never-leaves
    when: {types: [card_cvv]}
    action: redact

  # Frontier models get no personal or card data at all.
  - id: no-personal-data-to-frontier
    when:
      tiers: [frontier]
      classes: [identity_strong, financial, health, contact, personal, quasi]
    action: redact

  # The shared GPU server is used by several teams: no government IDs there.
  # (Rules can name particular endpoints, not only tiers.)
  - id: shared-server-no-ids
    when: {destinations: [vllm-gpu, sglang-gpu], classes: [identity_strong]}
    action: redact

  # Models on the analyst's machine or in the data centre may see the rest.
  - id: in-house-models
    when: {tiers: [local, internal]}
    action: allow

# Anything not covered above is redacted.
default_action: redact
