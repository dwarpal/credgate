# Builds both packages and runs every check in the Nix sandbox: R tests,
# Python tests (3.11, 3.13, 3.14), ruff, and the spec/licence sync check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write  # remove older Nix store caches of the same branch

jobs:
  nix-flake-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Packages nixpkgs' public cache lacks (R's shiny stack, openssl and
      # sodium on macOS; Python 3.11's packages) would otherwise be built
      # from source on every run. They are built first (ci-deps, kept alive
      # by its out-link) and the Nix store is kept in the GitHub Actions
      # cache; everything else is garbage-collected before saving. A new
      # cache is saved when flake.nix or flake.lock changes.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ci-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-ci-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          gc-max-store-size-macos: 1G
          purge: true
          purge-prefixes: nix-ci-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix build -L .#ci-deps --out-link ci-deps
      - run: nix flake check -L
