# R integration tests (Arrow, Parquet, DuckDB, SQLite). R's arrow and duckdb
# packages are large C++ builds, so they run here, on Linux only, when the R
# package, the spec or the flake changes - not in every CI run.
name: Integrations

on:
  push:
    branches: [main]
    paths: ["pkg/credgate/**", "spec/**", "flake.nix", "flake.lock", ".github/workflows/integrations.yml"]
  pull_request:
    paths: ["pkg/credgate/**", "spec/**", "flake.nix", "flake.lock", ".github/workflows/integrations.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # remove older Nix store caches of the same branch

jobs:
  r-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # The R packages nixpkgs' public cache lacks (duckdb, arrow, RPostgres)
      # take most of this job to build, so the Nix store is kept in the
      # GitHub Actions cache. Before saving, everything except those packages
      # is garbage-collected (they are kept alive by the out-link below).
      # A new cache is saved when flake.nix or flake.lock changes.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-r-integration-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-r-integration-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-r-integration-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix build -L .#legacyPackages.x86_64-linux.r-integration-deps --out-link r-integration-deps
      - run: nix build -L .#legacyPackages.x86_64-linux.r-integration-tests
