# R integration tests (Arrow, Parquet, DuckDB, SQLite). R's arrow and duckdb
# packages are large C++ builds, so they run here, on Linux only, when the R
# package, the spec or the flake changes - not in every CI run.
name: Integrations

on:
  push:
    branches: [main]
    paths: ["pkg/credgate/**", "spec/**", "flake.nix", "flake.lock", ".github/workflows/integrations.yml"]
  pull_request:
    paths: ["pkg/credgate/**", "spec/**", "flake.nix", "flake.lock", ".github/workflows/integrations.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build -L .#legacyPackages.x86_64-linux.r-integration-tests
