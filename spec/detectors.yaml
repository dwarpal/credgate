# Shared by every CredGate implementation (R, Python). The schema and engine
# semantics are defined in spec/README.md; engine parameters are in
# spec/engine.yaml. Write regular expressions in single-quoted strings
# (backslashes are literal; a single quote is written '').
#
# `{{name}}` inside a pattern, context, negative or rule `match` is replaced
# by the fragment `name`, or by the list `name` joined with "|".

