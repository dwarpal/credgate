                  'Nahan', 'Noida', 'Pakur', 'Panna', 'Patan', 'Patna', 'Pauri', 'Peren',
                  'Rasra', 'Reasi', 'Ropar', 'Sagar', 'Saiha', 'Salem', 'Samba', 'Saran',
                  'Satna', 'Seoni', 'Sidhi', 'Sikar', 'Sirsa', 'Sirsi', 'Siwan', 'Solan',
                  'Sukma', 'Surat', 'Tehri', 'Thane', 'Theni', 'Tirap', 'Udupi', 'Unnao',
                  'Vizag', 'Wokha', 'Yanam', 'Agra', 'Arni', 'Aska', 'Atur', 'Beed',
                  'Bhel', 'Bhuj', 'Deeg', 'Dhar', 'Doda', 'Durg', 'Etah', 'Gaya', 'Guna',
                  'Ibsb', 'Jind', 'Kota', 'Mahe', 'Moga', 'Orai', 'Pala', 'Pali', 'Phek',
                  'Pune', 'Puri', 'Rewa', 'Suri', 'Tapi', 'Tonk', 'Tura']
  # END india_places

tables:
  # Fourth character of a PAN (sixth of a GSTIN).
  pan_holder_types:
    'P': individual
    'C': company
    'H': HUF
    'F': firm
    'A': association of persons
    'T': trust
    'B': body of individuals
    'L': local authority
    'J': artificial juridical person
    'G': government


fragments:
  aadhaar_context: 'aadhaa?r|\badhar\b|\buid(?:ai)?\b|आधार'
  # Also the negative context of bank account numbers: "Contact Number:"
  # before a number marks it as a phone even when an IFSC is nearby.
  phone_context: '\bmob|\bphone|\bcell\b|whats ?app|\btel\b|\bph\b|\bcontact|मोबाइल|फ़ोन|फोन|संपर्क'
  ifsc_code: '\b[A-Z]{4}0[A-Z0-9]{6}\b'
  id_negative_context: '\border\b|\binvoice\b|\btxn\b|\btransaction\b|\bref(erence)?\b|\bticket\b|\btracking\b|\bawb\b|\butr\b'
  # Money context: a 10-digit amount is not a phone number.
  money_context: '₹|\brs\.?(?![\p{L}])|\binr\b|\bamount\b|\bprice\b|\bcrores?\b|\blakhs?\b|\bbalance\b|\btotal\b|रुपये|रुपए'

  # Card network prefixes and lengths, checked on the digits only.
  card_iin: '^(?:4[0-9]{12}(?:[0-9]{3}){0,2}|5[1-5][0-9]{14}|2(?:2[2-9][1-9]|2[3-9][0-9]|[3-6][0-9]{2}|7[01][0-9]|720)[0-9]{12}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11,16}|35[0-9]{14,17}|6[0-9]{15,18}|8[12][0-9]{14}|50[0-9]{14,17})$'

  # --- Names -------------------------------------------------------------
  # Words that end a name: field labels, relation markers, honorifics.
  name_stop_latin: '(?!(?i:thanks|thank|namaste|namaskar|dear|hello|hi|hey|please|kindly|sir|madam|address|addr|mobile|phone|mob|pan|aadhaar|aadhar|dob|age|gender|sex|email|pin|father|mother|son|daughter|wife|husband|and|account|a/c|the|of|is|was|in|at|on|for|to|with|no|name|resident|r/o|s/o|d/o|w/o|c/o|shri|shree|sri|smt|sh|kumari|km|mr|mrs|ms|miss|dr|late|sushri)(?![\p{L}]))'
  # Labels, relations and postpositions (possessives such as का/की/के).
  name_stop_indic: '(?!(?:पता|मोबाइल|फोन|पिता|माता|पति|पत्नी|पुत्र|पुत्री|आयु|उम्र|निवासी|ग्राम|जन्म|और|का|की|के|को|ने|से|है|में)(?![\p{L}\p{M}]))'
  # Words that show a capitalised phrase after an honorific is not a person:
  # software ("Ms Word"), festivals ("Shri Ram Navami"), institutions
  # ("Shri Ram Mandir Trust").
  not_a_name: '(?!(?:{{latin_cap_word}}[ ]){0,3}(?i:word|excel|powerpoint|outlook|teams|office|navami|jayanti|ashtami|chaturthi|purnima|puja|pooja|utsav|mahotsav|mandir|temple|trust|ashram|sansthan|samiti|vidyalaya|school|college|hospital|foundation)(?![\p{L}]))'
  not_a_name_indic: '(?!(?:{{indic_word}}[ ]){0,2}(?:नवमी|जयंती|अष्टमी|चतुर्थी|पूर्णिमा|पूजा|उत्सव|महोत्सव|मंदिर|ट्रस्ट|आश्रम|संस्थान|समिति|विद्यालय)(?![\p{L}\p{M}]))'
  indic_word: '[\p{Script=Devanagari}\p{Script=Bengali}\p{Script=Gujarati}\p{Script=Gurmukhi}\p{Script=Tamil}\p{Script=Telugu}\p{Script=Kannada}\p{Script=Malayalam}\p{Script=Oriya}]+'
  # Capitalised Latin word ("Ramesh", "RAMESH"), or an initial with a full
  # stop when another word follows ("R. K. Sharma"). A full word never takes
  # the full stop, so a name does not run into the next sentence.
  latin_cap_word: '\p{Lu}(?:\.(?=\s\p{L})|[\p{Script=Latin}'']*)'
  # Any-case Latin word; used only after an explicit label or relation.
  # Latin script only, so a Devanagari name after a Latin label is read as an
  # Indic name, not cut at its first vowel sign.
  latin_any_word: '\p{Script=Latin}(?:\.(?=\s\p{L})|[\p{Script=Latin}'']*)'
  latin_name_cap: '{{name_stop_latin}}{{latin_cap_word}}(?:[ ]{{name_stop_latin}}{{latin_cap_word}}){0,3}'
  latin_name_any: '{{name_stop_latin}}{{latin_any_word}}(?:[ ]{{name_stop_latin}}{{latin_any_word}}){0,3}'
  indic_name: '{{name_stop_indic}}{{indic_word}}(?:[ ]{{name_stop_indic}}{{indic_word}}){0,2}'
  honorific_latin: '(?i:\b(?:shri|shree|sri|smt|kumari|km|mr|mrs|ms|miss|dr|late|sh|sushri))\.?\s{1,2}'
  honorific_indic: '(?:श्री|श्रीमती|कुमारी|सुश्री|स्व\.|स्वर्गीय|डॉ\.?|श्रीमान)\s{1,2}'
  relation_latin: '(?i:\b(?:[sdwch]/o|son of|daughter of|wife of|husband of|care of|father''?s? name|mother''?s? name|spouse''?s? name|guardian)\b)\.?\s{0,2}[:-]?\s{0,2}'
  label_latin: '(?i:\b(?:name|naam|customer name|applicant name|full name|nominee|borrower|co-borrower|insured|policy ?holder|patient(?: name)?|account holder|beneficiary))\s{0,2}[:-]\s{0,3}'
  label_indic: '(?:नाम|पिता का नाम|पति का नाम|माता का नाम)\s{0,2}[:-]\s{0,3}'
  # Column names (or a caller's context, such as "customer name") that say
  # a value is a person's name. The whole label must match: "customer_name"
  # and "nominee" do, "product_name", "branch_name" and "user_name" do not.
  # A language suffix is allowed: "name_hi", "customer_name_en".
  name_column_label: '^\s*(?:(?:customer|cust|client|borrower|co[ _-]?borrower|applicant|co[ _-]?applicant|nominee|account[ _-]?holder|holder|payee|beneficiary|guarantor|insured|patient|employee|emp|person|contact|father|mother|spouse|husband|wife|guardian)(?:''s)?[ _-]?)?(?:(?:full|first|middle|last|given|family|sur)[ _-]?)?(?:name|naam)(?:[ _-]?(?:hi|en|hindi|english|local|regional|vernacular))?\s*$|^\s*(?:nominee|borrower|applicant|guarantor|beneficiary|payee|account[ _-]?holder)\s*$|^\s*(?:नाम|ग्राहक का नाम|पिता का नाम|माता का नाम|पति का नाम)\s*$'
  # A value that is only a name: letters (any script), with initials,
  # apostrophes and hyphens; up to five words.
  name_column_value: '^[\p{L}\p{M}]+(?:[''’-][\p{L}\p{M}]+)*\.?(?:[ .]{1,2}[\p{L}\p{M}]+(?:[''’-][\p{L}\p{M}]+)*\.?){0,4}$'
  # Column names that say a value is a postal address. Not "email_address"
  # or "ip_address": the whole label must match.
  address_column_label: '^\s*(?:(?:residential|permanent|correspondence|current|present|home|office|postal|mailing|billing|shipping|communication|customer|cust)[ _-]?)?addr(?:ess)?(?:[ _-]?line)?(?:[ _-]?[0-9])?\s*$|^\s*(?:पता|पत्ता|निवासी|स्थायी पता|ঠিকানা|முகவரி|ਪਤਾ|સરનામું|చిరునామా|ವಿಳಾಸ)\s*$'

  # Labels right before a value; each fragment is one group, so it can be
  # spliced into a pattern.
  ration_label: '(?:(?i:\b(?:ration card|ration)(?: card)?\s?(?:no\.?|number|num|#)?)\s{0,2}[:#-]?\s{0,3}|राशन कार्ड(?:\s?(?:संख्या|नंबर|क्रमांक))?\s{0,2}[:-]?\s{0,3})'
  cvv_label: '(?:(?i:\b(?:cvv2?|cvc2?|cid|cvn|card verification (?:code|value|number)|security code))\s?(?:(?i:no\.?|number|code)\s?)?(?:(?i:is)\s)?[:#-]?\s{0,3}|सीवीवी\s{0,2}[:-]?\s{0,3})'

  # --- Addresses ---------------------------------------------------------
  address_label_latin: '(?i:\b(?:address|addr|residential address|permanent address|correspondence address|r/o|resident of)\b)\.?\s{0,2}[:-]?\s{0,3}'
  # "Address" in Hindi (पता, पते), Marathi (पत्ता), Bengali, Tamil, Punjabi,
  # Gujarati, Telugu and Kannada.
  address_label_indic: '(?:पता|पते|पत्ता|निवासी|ঠিকানা|முகவரி|ਪਤਾ|સરનામું|చిరునామా|ವಿಳಾಸ)\s{0,2}[:-]?\s{0,3}'
  address_keyword_latin: '(?i:\b(?:house|h\.?\s?no|flat|plot|door no|shop no|room no|qtr|quarter no|bldg|building|vill(?:age)?|gram)\b)'
  address_keyword_indic: '(?:मकान|ग्राम|गांव|गाँव|मोहल्ला)'
  # Ends at a new field (line break, ";" or "|"), the end of text, or the
  # next contact/identifier label.
  # An address also ends right after its PIN code.
  address_terminator: '(?:(?<=\b[1-9][0-9]{2}\s?[0-9]{3})(?![0-9])|(?=\s*(?:[\n;|]|$|(?i:\b(?:mobile|phone|mob|email|pan|aadhaar|dob)\b))))'
  # Starts on a real character, not on the label's colon or spacing, and not
  # on "[", so redaction placeholders such as [ABHA_ADDRESS] are not re-read
  # as an address.
  address_body: '[^\s:;|\[-][^\n;|]{5,159}?'
  pin_tail: '\b[1-9][0-9]{2}\s?[0-9]{3}\b'
  # A locality as written in an address: up to six words, each starting with
  # a capital letter or a digit ("Hauz Khas", "Sector 17", "MG Road", "3rd Cross").
  locality: '[\p{Lu}0-9][\p{L}\p{N}.''/-]*(?:[ ][\p{Lu}0-9][\p{L}\p{N}.''/-]*){0,5}'

detectors:

  # --- Government identifiers --------------------------------------------

  - id: aadhaar
    class: identity_strong
    label: Aadhaar number
    patterns: ['[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}']
    bounded: true
    validate: [verhoeff]
    checks: Verhoeff checksum valid
    base: 0.85
    context: '{{aadhaar_context}}'
    negative: '{{id_negative_context}}'

  - id: aadhaar_masked
    class: quasi
    label: Masked Aadhaar number
    patterns: ['[Xx*]{4}[ -]?[Xx*]{4}[ -]?[0-9]{4}']
    bounded: true
    base: 0.9
    context: '{{aadhaar_context}}'

  - id: aadhaar_vid
    class: identity_strong
    label: Aadhaar Virtual ID
    patterns: ['[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}']
    bounded: true
    validate: [verhoeff]
    checks: Verhoeff checksum valid
    base: 0.9
    context: '\bvid\b|virtual\s*id'
    context_required: true

  - id: pan
    class: identity_strong
    label: PAN
    patterns: ['[A-Z]{3}[ABCFGHLJPT][A-Z][0-9]{4}[A-Z]']
    bounded: true
    ignore_case: true
    base: 0.85
    context: '\bpan\b|permanent\s+account|पैन'
    describe: {position: 4, table: pan_holder_types, template: 'holder type: {}'}

  - id: voter_epic
    class: identity_strong
    label: Voter ID (EPIC)
    patterns: ['[A-Z]{3}[0-9]{7}']
    bounded: true
    ignore_case: true
    base: 0.85
    # The format alone (3 letters, 7 digits) could be a product code.
    base_without_context: 0.3
    # "Voter" and "elector" in Hindi, Marathi, Bengali, Tamil, Telugu,
    # Gujarati, Kannada and Punjabi, as Indian-language text writes them.
    context: '\bvoter|\bepic\b|election|electoral|मतदाता|मतदार|वोटर|ভোটার|வாக்காளர்|ఓటరు|ఓటర్|મતદાર|ಮತದಾರ|ਵੋਟਰ'

  - id: passport
    class: identity_strong
    label: Indian passport number
    patterns: ['[A-PR-WY][1-9][0-9] ?[0-9]{4}[1-9]']
    bounded: true
    ignore_case: true
    base: 0.85
    context: 'passport|पासपोर्ट'
    context_required: true

  # Central KYC Identifier Number (KIN), issued by CERSAI: 14 digits. Bare
  # 14-digit numbers are common, so only with a cue.
  - id: ckyc
    class: identity_strong
    label: CKYC number (KIN)
    patterns: ['[0-9]{14}']
    bounded: true
    base: 0.85
    context: '\bc-?kyc|\bkin\b|kyc identifi|kyc id\b|central kyc|सीकेवाईसी'
    context_required: true

  # Ration card numbers have no national format (each state issues its
  # own), so only right after a ration-card label: 6-20 characters with at
  # least 6 digits.
  - id: ration_card
    class: identity_strong
    label: Ration card number
    patterns:
      - '{{ration_label}}(?<value>(?=(?:[A-Za-z/-]*[0-9]){6})[A-Za-z0-9][A-Za-z0-9/-]{5,19})(?![A-Za-z0-9/-])'
    capture: value
    base: 0.9
    # A column named for ration cards labels values that are only the number.
    column_label:
      label: '\bration\b|राशन'
      patterns: ['^(?=(?:[A-Za-z/-]*[0-9]){6})[A-Za-z0-9][A-Za-z0-9/-]{5,19}$']

  # MGNREGA job card: state, district, block, gram panchayat and village
  # codes, then the household number, as commonly printed
  # (UP-12-005-021-001/123). Digit counts vary by state.
  - id: nrega_job_card
    class: identity_strong
    label: NREGA job card number
    patterns: ['[A-Z]{2}-[0-9]{2,3}(?:-[0-9]{2,4}){2,3}/[0-9]{1,6}']
    bounded: true
    base: 0.85
    base_without_context: 0.6
    context: 'job ?card|\bj\.?c\.? ?no|nrega|narega|जॉब कार्ड|नरेगा|मनरेगा'
    canonical: collapse_upper

  - id: driving_licence
    class: identity_strong
    label: Driving licence number
    patterns: ['(?:{{india_state_codes}})[ -]?[0-9]{2}[ -]?(?:19|20)[0-9]{2}[ -]?[0-9]{7}']
    bounded: true
    ignore_case: true
    base: 0.75
    context: 'driving|licen[cs]e|\bdl\b|ड्राइविंग'

  # --- Financial ---------------------------------------------------------

  - id: gstin
    class: financial
    label: GSTIN
    patterns: ['[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]']
    bounded: true
    ignore_case: true
    validate: [gstin]
    checks: GSTIN state code and check character valid
    base: 0.97
    context: '\bgst|जीएसटी'
    describe: {position: 6, table: pan_holder_types, template: 'embeds PAN of {}'}

  - id: card
    class: financial
    label: Payment card number
    patterns: ['[0-9](?:[ -]?[0-9]){12,18}']
    bounded: true
    validate: [luhn, {match_stripped: '{{card_iin}}'}]
    checks: Luhn checksum and card network prefix valid
    # Written in ABHA's 2-4-4-4 hyphenated layout, a number is far more likely
    # an ABHA number that happens to pass Luhn than a card.
    base:
      default: 0.9
      rules:
        - {match: '^[0-9]{2}-[0-9]{4}-[0-9]{4}-[0-9]{4}$', value: 0.5}
    context: 'card|credit|debit|visa|master|rupay|amex|कार्ड'
    negative: '{{id_negative_context}}'

  # Card verification code (CVV/CVC/CID): sensitive authentication data
  # under PCI DSS, never to be stored. Only right after its label
  # ("CVV 123", "cvv: 4321", "security code 777"): a nearby mention of CVV
  # is not enough for a bare 3-digit number.
  - id: card_cvv
    class: sensitive_auth
    label: Card verification code
    patterns: ['{{cvv_label}}(?<value>[0-9]{3,4})(?![0-9/])']
    capture: value
    base: 0.9
    # A column named for CVVs labels values that are only the code. Not
    # `cid`: as a column name it usually means customer id.
    column_label:
      label: '\bcvv2?\b|\bcvc2?\b|\bcvn\b|card verification|card security code|सीवीवी'
      patterns: ['^[0-9]{3,4}$']

  # Card expiry date, MM/YY or MM/YYYY. Only with a cue.
  - id: card_expiry
    class: financial
    label: Card expiry date
    # Not the month and year of a full date (31/12/2026, 31-12-2026).
    patterns: ['(?<![0-9][/-])(?:0[1-9]|1[0-2]) ?[/-] ?(?:20[0-9]{2}|[0-9]{2})(?![/-][0-9])']
    bounded: true
    base: 0.85
    context: '\bexp(?:iry|iration|ires|\.)?\b|valid (?:thru|through|till|upto|up to)|\bmm ?/ ?yy|समाप्ति'
    context_required: true
    canonical: collapse_upper

  - id: upi_id
    class: financial
    label: UPI ID
    # No domain dot after the handle, so email addresses are not matched.
    patterns: ['(?<![\p{L}\p{N}._-])[A-Za-z0-9][A-Za-z0-9._-]{1,255}@[A-Za-z][A-Za-z0-9]{1,63}(?![\p{L}\p{N}@])(?!\.[A-Za-z])']
    base:
      default: 0.6
      rules:
        - {match: '(?i)@(?:{{upi_handles}})$', value: 0.95}
    context: '\bupi\b|\bvpa\b|gpay|phonepe|paytm|bhim'
    describe:
      default: unknown handle
      rules:
        - {match: '(?i)@(?:{{upi_handles}})$', text: known UPI handle}
    canonical: lower

  - id: ifsc
    class: quasi
    label: IFSC code
    patterns: ['[A-Z]{4}0[A-Z0-9]{6}']
    bounded: true
    ignore_case: true
    base:
      default: 0.6
      rules:
        - {match: '^[^a-z]*$', value: 0.9}
    context: '\bifsc|\bbranch\b|\bbank\b'

  - id: bank_account
    class: financial
    label: Bank account number
    patterns: ['[0-9]{9,18}']
    bounded: true
    base: 0.85
    # An IFSC next to a number is evidence of an account (bank records
    # list them together).
    context: '\ba/?c\b|\bacct|\baccount|\bsavings\b|\bcurrent a|\bbank\b|खाता|बैंक|{{ifsc_code}}'
    negative: '{{phone_context}}'
    context_required: true

  # --- Contact -----------------------------------------------------------

  - id: mobile_in
    class: contact
    label: Indian mobile number
    patterns: ['(?:\+91[ -]?|91[ -]|0)?[6-9][0-9](?:[ -]?[0-9]){8}']
    bounded: true
    # A number written with +91 or a leading 0 is far more likely a phone.
    base:
      default: 0.65
      rules:
        - {match: '^(?:\+91|0|91[ -])', value: 0.85}
    context: '{{phone_context}}'
    negative: '{{money_context}}|{{id_negative_context}}'
    canonical: last10_digits

  - id: email
    class: contact
    label: Email address
    patterns: ['(?<![\p{L}\p{N}._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}(?![\p{L}\p{N}])']
    base: 0.95
    canonical: lower

  - id: pincode
    class: quasi
    label: PIN code
    patterns: ['[1-9][0-9]{2} ?[0-9]{3}']
    bounded: true
    base: 0.8
    context: '\bpin\b|pin ?code|postal|\bzip\b|पिन'
    context_required: true

  # --- Health (Ayushman Bharat Digital Mission) ---------------------------

  - id: abha_number
    class: health
    label: ABHA number
    patterns: ['[0-9]{2}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}']
    bounded: true
    # The official 2-4-4-4 hyphenated layout is distinctive; 14 bare digits
    # are not (CKYC numbers have the same length).
    base:
      default: 0.4
      rules:
        - {match: '^[0-9]{2}-[0-9]{4}-[0-9]{4}-[0-9]{4}$', value: 0.85}
    context: '\babha\b|health ?id|ayushman|\babdm\b|\bndhm\b|आभा'

  - id: abha_address
    class: health
    label: ABHA address
    patterns: ['(?<![\p{L}\p{N}._])[A-Za-z0-9][A-Za-z0-9._]{2,31}@(?:abdm|sbx)(?![\p{L}\p{N}])']
    ignore_case: true
    base: 0.97
    canonical: lower

  # --- Names and addresses (rule-based) ------------------------------------
  # These fire only where the text signals a name or address: an honorific,
  # a relation (S/o, D/o), a field label, or a house/village keyword followed
  # by a PIN code. Names in running text without such a cue are not found.

  - id: person_name
    class: personal
    label: Person name
    patterns:
      - '{{honorific_latin}}{{not_a_name}}(?<value>{{latin_name_cap}})'
      # "ji" after a name is an honorific in Hindi and Hinglish.
      - '(?<![\p{L}]){{not_a_name}}(?<value>{{latin_name_cap}})\s(?i:ji)(?![\p{L}])'
      - '{{relation_latin}}(?<value>{{latin_name_any}})'
      - '{{label_latin}}(?<value>{{latin_name_any}})'
      # Mixed scripts: a Latin cue before an Indic name ("Smt. सुनीता देवी")
      # and an Indic cue before a Latin name ("श्री Ramesh Kumar").
      - '{{honorific_latin}}{{not_a_name_indic}}(?<value>{{indic_name}})'
      - '{{relation_latin}}(?<value>{{indic_name}})'
      - '{{label_latin}}(?<value>{{indic_name}})'
      - '{{honorific_indic}}{{not_a_name}}(?<value>{{latin_name_cap}})'
      - '{{label_indic}}(?<value>{{latin_name_any}})'
      - '{{honorific_indic}}{{not_a_name_indic}}(?<value>{{indic_name}})'
      - '(?<![\p{L}\p{M}])(?<value>{{indic_name}})\s?जी(?![\p{L}\p{M}])'
      - '{{label_indic}}(?<value>{{indic_name}})'
    capture: value
    base: 0.8
    canonical: collapse_upper
    # A column (or caller's context) named for names: every value that is
    # only a name is one, in any letter case or script.
    column_label:
      label: '{{name_column_label}}'
      patterns: ['{{name_column_value}}']

  - id: address
    class: personal
    label: Postal address
    patterns:
      - '{{address_label_latin}}(?<value>{{address_body}}){{address_terminator}}'
      - '{{address_label_indic}}(?<value>{{address_body}}){{address_terminator}}'
      - '(?<value>{{address_keyword_latin}}[^\n;|]{3,160}?{{pin_tail}})'
      - '(?<value>{{address_keyword_indic}}[^\n;|]{3,160}?{{pin_tail}})'
      # Without a label: a house number, the locality, then a known Indian
      # city or district and a PIN code ("210 Hauz Khas, Ahmedabad 380015").
      # Every word of the locality starts with a capital or a digit, so a
      # sentence ("Invoice 552 for 3 units, Pune 411001") is not one; and the
      # number does not follow a reference word ("Ticket 4471 ...").
      - '(?<value>(?<![\p{L}\p{N}/-])(?<!(?i:ticket|order|invoice|ref|txn|awb|utr|receipt|case)[ #:.-]{1,3})[0-9]{1,5}[A-Za-z]?(?:[/-][0-9A-Za-z]{1,5})?,?\s+{{locality}}(?:,\s*{{locality}}){0,2},\s*(?i:{{india_places}})[\s,-]{0,3}{{pin_tail}})'
    capture: value
    # An address that ends in a PIN code is strong evidence (and must win over
    # the PIN code inside it).
    base:
      default: 0.85
      rules:
        - {match: '\b[1-9][0-9]{2}\s?[0-9]{3}$', value: 0.97}
    canonical: collapse_upper
    # A column named for addresses: a value with letters in it is one (not
    # an e-mail address or a web link).
    column_label:
      label: '{{address_column_label}}'
      patterns: ['^(?=[^\n]*\p{L})(?![^\n]*@)(?!\s*(?:https?://|www\.))[^\n]{6,300}$']
