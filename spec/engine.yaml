# CredGate detection engine parameters.
#
# Shared by every CredGate implementation (R, Python). Semantics are defined
# in spec/README.md. Regular expressions use the subset of syntax supported
# by both ICU (R/stringi) and the Python `regex` module; write them in
# single-quoted YAML strings so backslashes are taken literally.

spec_version: 1

normalisation:
  # Each code point is normalised on its own (NFKC), after the mappings below.
  form: NFKC
  # Code point of the zero in each decimal-digit block mapped to ASCII 0-9:
  # Arabic-Indic, Extended Arabic-Indic (Urdu), Devanagari, Bengali, Gurmukhi,
  # Gujarati, Odia, Tamil, Telugu, Kannada, Malayalam.
  digit_zeros: ['U+0660', 'U+06F0', 'U+0966', 'U+09E6', 'U+0A66', 'U+0AE6',
                'U+0B66', 'U+0BE6', 'U+0C66', 'U+0CE6', 'U+0D66']
  # Removed: zero-width space/non-joiner/joiner, word joiner, BOM, soft hyphen.
  remove: ['U+200B', 'U+200C', 'U+200D', 'U+2060', 'U+FEFF', 'U+00AD']
  # Mapped to "-".
  dash: ['U+2010', 'U+2011', 'U+2012', 'U+2013', 'U+2014', 'U+2015', 'U+2212']

# Wrapped around every pattern of a detector with `bounded: true`, so a match
# never starts or ends inside a longer token (e.g. a 12-digit window of a
# 16-digit card number).
boundary:
  before: '(?<![\p{L}\p{N}])(?<![\p{N}][ -])'
  after: '(?![\p{L}\p{N}])(?![ -][\p{N}])'

# Characters removed before checksum validation and by the `strip_upper`
# canonical form.
separators: '[\s-]'

scoring:
  # Characters searched on each side of a match for context keywords.
  context_window: 40
  # With a context keyword: score + (1 - score) * context_boost.
  context_boost: 0.8
  # With a negative keyword: score * negative_factor (applied after the boost).
  negative_factor: 0.5
  # Decimal places of the reported confidence.
  digits: 2
