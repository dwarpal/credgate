# Policy file layout and change cases (spec/README.md, "Policy files and
# change log"). `layout`: a policy and the exact file a credgate tool writes
# for it. `diff`: two policies and the changes, in order.
#
# Policies are given as JSON (a subset of YAML) so they are read the same
# everywhere.

spec_version: 1

layout:
  - policy: {"policy":"credgate-policy","version":1,"id":"conf","revision":1,"description":"Conformance policy","destinations":{"local":{"tier":"local","provider":"ollama","url":"http://localhost:11434/v1"},"claude":{"tier":"frontier","provider":"anthropic","description":"via the gateway"},"copilot":{"tier":"frontier","blocked":true}},"min_confidence":0.5,"rules":[{"id":"card-block","when":{"tiers":["frontier"],"all_of":["card","card_cvv"]},"action":"block"},{"id":"ids-tokenised","description":"RBI","when":{"tiers":["frontier"],"classes":["identity_strong"]},"action":"tokenise"},{"id":"local-ok","when":{"destinations":["local"]},"action":"allow"}],"default_action":"redact"}
