# Detection conformance cases. Every CredGate implementation must produce
# exactly these matches (no more, no fewer) for each case, using the
# built-in detectors with default settings.
#
# Fields per case:
#   id        unique name
#   text      input text (one document)
#   context   optional extra context (e.g. a column name)
#   expect    the complete list of matches; each has `type` and `value`, and
#             optionally `confidence`, `canonical`, `span` ([start, end) as
#             0-based code-point offsets) and `reason` (a substring of the
#             match's reasons).
#
# All identifiers are synthetic.

spec_version: 1

cases:

  # --- Aadhaar -------------------------------------------------------------
  - id: aadhaar-with-context
    text: 'Aadhaar: 542229371182'
    expect:
      - {type: aadhaar, value: '542229371182', confidence: 0.97, reason: Verhoeff checksum valid}
  - id: aadhaar-spaced-uid-context
    text: 'UID 9481 8614 4308'
    expect:
      - {type: aadhaar, value: '9481 8614 4308', canonical: '948186144308', confidence: 0.97}
  - id: aadhaar-without-context
    text: '718467284276'
    expect:
      - {type: aadhaar, value: '718467284276', confidence: 0.85}
  - id: aadhaar-bad-checksum
    text: 'Aadhaar 718467284277'
    expect: []
  - id: aadhaar-negative-context
    text: 'order no 878245671885'
    expect:
      - {type: aadhaar, value: '878245671885', confidence: 0.42, reason: "negative context 'order'"}
  - id: aadhaar-inside-longer-number
    text: '9718467284276'
    expect: []
  - id: aadhaar-devanagari-digits
    text: 'आधार ७१८४ ६७२८ ४२७६ है'
    expect:
      - {type: aadhaar, value: '७१८४ ६७२८ ४२७६', canonical: '718467284276', span: [5, 19], confidence: 0.97}
  - id: pan-with-zero-width-space
    text: "PAN ABC​PE1234F"
    expect:
      - {type: pan, value: "ABC​PE1234F", canonical: ABCPE1234F, confidence: 0.97}
  - id: aadhaar-masked
    text: 'Aadhaar XXXX XXXX 4276'
    expect:
      - {type: aadhaar_masked, value: 'XXXX XXXX 4276', confidence: 0.98}
  - id: aadhaar-vid-with-context
    text: 'VID: 7828638538075372'
    expect:
      - {type: aadhaar_vid, value: '7828638538075372', confidence: 0.98}
  - id: aadhaar-vid-needs-context
    text: '7828638538075372'
    expect: []

  # --- Other government IDs -------------------------------------------------
  - id: pan-individual
    text: 'Customer PAN: HUUPA2420A.'
    expect:
      - {type: pan, value: HUUPA2420A, confidence: 0.97, reason: 'holder type: individual'}
  - id: pan-company-lower-case
    text: 'pan aaacr5055k'
    expect:
      - {type: pan, value: aaacr5055k, canonical: AAACR5055K, confidence: 0.97, reason: 'holder type: company'}
  - id: voter-format-alone-is-low-confidence
    text: 'ABC1234567'
    expect:
      - {type: voter_epic, value: ABC1234567, confidence: 0.3}
  - id: voter-with-context
    text: 'voter id FSO6231132'
    expect:
      - {type: voter_epic, value: FSO6231132, confidence: 0.97}
  - id: voter-hindi-context
    text: 'मतदाता ABC1234567'
    expect:
      - {type: voter_epic, value: ABC1234567, confidence: 0.97}
  - id: voter-context-argument
    text: 'JFK5504535'
    context: voter_id
    expect:
      - {type: voter_epic, value: JFK5504535, confidence: 0.97}
  - id: passport-with-context
    text: 'Passport: M2870698'
    expect:
      - {type: passport, value: M2870698, confidence: 0.97}
  - id: driving-licence
    text: 'DL no: OR7020101552421'
    expect:
      - {type: driving_licence, value: OR7020101552421, confidence: 0.95}
  - id: driving-licence-spaced-without-context
    text: 'MH12 20110012345'
    expect:
      - {type: driving_licence, value: 'MH12 20110012345', confidence: 0.75}

  # --- GSTIN and cards ------------------------------------------------------
  - id: gstin-wins-over-embedded-pan
    text: 'GSTIN 27AAPFU0939F1ZV'
    expect:
      - {type: gstin, value: 27AAPFU0939F1ZV, confidence: 0.99, reason: embeds PAN of firm}
  - id: gstin-bad-check-character
    text: '27AAPFU0939F1ZA'
    expect: []
  - id: card-not-reported-as-aadhaar
    text: '4111 1111 1111 1111'
    expect:
      - {type: card, value: '4111 1111 1111 1111', confidence: 0.9}
  - id: card-with-context
    text: 'card: 4952414341756701'
    expect:
      - {type: card, value: '4952414341756701', confidence: 0.98}

  # --- UPI, IFSC, bank accounts -----------------------------------------------
  - id: upi-known-handle
    text: 'pay ramesh@okaxis'
    expect:
      - {type: upi_id, value: ramesh@okaxis, confidence: 0.95, reason: known UPI handle}
  - id: upi-unknown-handle
    text: 'ramesh@somewallet'
    expect:
      - {type: upi_id, value: ramesh@somewallet, confidence: 0.6, reason: unknown handle}
  - id: upi-before-full-stop
    text: 'Pay to priya.s@ybl.'
    expect:
      - {type: upi_id, value: priya.s@ybl, confidence: 0.95}
  - id: email-not-upi
    text: 'mail ramesh@mail.example.com'
    expect:
      - {type: email, value: ramesh@mail.example.com, confidence: 0.95}
  - id: ifsc-upper
    text: 'HDFC0001234'
    expect:
      - {type: ifsc, value: HDFC0001234, confidence: 0.9}
  - id: ifsc-lower
    text: 'hdfc0001234'
    expect:
      - {type: ifsc, value: hdfc0001234, confidence: 0.6}
  - id: ifsc-fifth-char-must-be-zero
    text: 'HDFC1001234'
    expect: []
  - id: bank-account-needs-context
    text: 'ref 123456789012345'
    expect: []
  - id: bank-account-with-context
    text: 'A/c 50100123456789'
    expect:
      - {type: bank_account, value: '50100123456789', confidence: 0.97}
  - id: bank-account-hindi-context
    text: 'खाता संख्या 123456789'
    expect:
      - {type: bank_account, value: '123456789', confidence: 0.97}
  - id: bank-account-beats-mobile
    text: 'account 9876543210'
    expect:
      - {type: bank_account, value: '9876543210', confidence: 0.97}

  - id: csv-fields-stay-separate
    text: 'ABCPE1234F,9876543210,8826781145'
    expect:
      - {type: pan, value: ABCPE1234F}
      - {type: mobile_in, value: '9876543210'}
      - {type: mobile_in, value: '8826781145'}

  # --- Contact ----------------------------------------------------------------
  - id: mobile-plus91
    text: '+91 98765 43210'
    expect:
      - {type: mobile_in, value: '+91 98765 43210', canonical: '9876543210', confidence: 0.85}
  - id: mobile-leading-zero
    text: '098765-43210'
    expect:
      - {type: mobile_in, value: '098765-43210', canonical: '9876543210', confidence: 0.85}
  - id: mobile-bare
    text: '9876543210'
    expect:
      - {type: mobile_in, value: '9876543210', confidence: 0.65}
  - id: mobile-91-prefix
    text: '91-9876543210'
    expect:
      - {type: mobile_in, value: '91-9876543210', canonical: '9876543210', confidence: 0.85}
  - id: mobile-hindi-context
    text: 'मोबाइल 8826781145'
    expect:
      - {type: mobile_in, value: '8826781145', confidence: 0.93}
  - id: mobile-cannot-start-with-5
    text: '5876543210'
    expect: []
  - id: pincode-needs-context
    text: 'total 560001'
    expect: []
  - id: pincode-spaced
    text: 'PIN 560 001'
    expect:
      - {type: pincode, value: '560 001', confidence: 0.96}
  - id: pincode-hindi-context
    text: 'पिन 560001'
    expect:
      - {type: pincode, value: '560001', confidence: 0.96}

  # --- Health -------------------------------------------------------------------
  - id: abha-hyphenated
    text: '81-3181-3600-6139'
    expect:
      - {type: abha_number, value: 81-3181-3600-6139, confidence: 0.85}
  - id: abha-layout-beats-luhn-valid-card
    text: '38-5649-8873-9232'
    expect:
      - {type: abha_number, value: 38-5649-8873-9232, confidence: 0.85}
  - id: abha-bare-digits-weak
    text: '12345678901234'
    expect:
      - {type: abha_number, value: '12345678901234', confidence: 0.4}
  - id: abha-bare-digits-with-context
    text: 'ABHA 12345678901234'
    expect:
      - {type: abha_number, value: '12345678901234', confidence: 0.88}
  - id: abha-address
    text: 'id aarav.k21@abdm'
    expect:
      - {type: abha_address, value: aarav.k21@abdm, confidence: 0.97}
  - id: abha-address-sandbox
    text: 'test user@sbx'
    expect:
      - {type: abha_address, value: user@sbx, confidence: 0.97}

  # --- Names ----------------------------------------------------------------------
  - id: name-after-shri
    text: 'Shri Ramesh Kumar'
    expect:
      - {type: person_name, value: Ramesh Kumar, confidence: 0.8}
  - id: name-after-smt-with-period
    text: 'Smt. Kamla Devi'
    expect:
      - {type: person_name, value: Kamla Devi}
  - id: name-late-shri
    text: 'Late Shri Mohan Lal'
    expect:
      - {type: person_name, value: Mohan Lal}
  - id: name-after-relation
    text: 'S/o Ganpat Patil'
    expect:
      - {type: person_name, value: Ganpat Patil}
  - id: name-label-lower-case
    text: 'Name: anil verma'
    expect:
      - {type: person_name, value: anil verma, canonical: ANIL VERMA}
  - id: name-with-initials
    text: 'Dr. R. K. Sharma'
    expect:
      - {type: person_name, value: R. K. Sharma}
  - id: name-drops-full-stop
    text: 'Nominee - Sunita Rao.'
    expect:
      - {type: person_name, value: Sunita Rao}
  - id: name-stops-at-next-label
    text: 'Name: Ramesh Kumar Mobile 9876543210'
    expect:
      - {type: person_name, value: Ramesh Kumar}
      - {type: mobile_in, value: '9876543210', confidence: 0.93}
  - id: name-and-address-labels
    text: 'Name: Ramesh Kumar Address: 12 MG Road'
    expect:
      - {type: person_name, value: Ramesh Kumar}
      - {type: address, value: 12 MG Road, confidence: 0.85}
  - id: name-devanagari-drops-possessive
    text: 'श्रीमती सुनीता देवी का घर'
    expect:
      - {type: person_name, value: सुनीता देवी, canonical: सुनीता देवी}
  - id: name-devanagari-label
    text: 'नाम: रमेश कुमार पिता'
    expect:
      - {type: person_name, value: रमेश कुमार}
  - id: capitalised-prose-is-not-a-name
    text: 'The Report Was Submitted On Time By The Committee'
    expect: []
  - id: lone-honorific
    text: 'Mr'
    expect: []

  # --- Addresses ------------------------------------------------------------------
  - id: address-labelled
    text: 'Address: Flat 4B, Shanti Apartments, Kothrud, Pune 411038; Phone x'
    expect:
      - {type: address, value: 'Flat 4B, Shanti Apartments, Kothrud, Pune 411038', canonical: 'FLAT 4B, SHANTI APARTMENTS, KOTHRUD, PUNE 411038'}
  - id: address-short-label-stops-at-mobile
    text: 'Addr - 22 MG Road, Bengaluru 560001 Mobile 9876543210'
    expect:
      - {type: address, value: '22 MG Road, Bengaluru 560001'}
      - {type: mobile_in, value: '9876543210', confidence: 0.93}
  - id: address-house-keyword-to-pin
    text: 'R/o House No 12, Laxmi Nagar, Pune 411038'
    expect:
      - {type: address, value: 'House No 12, Laxmi Nagar, Pune 411038'}
  - id: address-unlabelled
    text: 'lives at House No 111, Anna Salai, Pune 334917.'
    expect:
      - {type: address, value: 'House No 111, Anna Salai, Pune 334917'}
  - id: address-hindi
    text: 'पता: ग्राम रामपुर, जिला सीतापुर 261001'
    expect:
      - {type: address, value: 'ग्राम रामपुर, जिला सीतापुर 261001'}

  # --- Whole records ----------------------------------------------------------------
  - id: mixed-customer-record
    text: 'Name: Priya Nair; Mobile: +91 91234 56789; Email: priya.nair@example.org; PAN: ABCPN1234K; UPI: priya.n@oksbi; A/c 50100987654321 IFSC HDFC0004567; Address: House No 7, Civil Lines, Jaipur 302006'
    expect:
      - {type: person_name, value: Priya Nair}
      - {type: mobile_in, value: '+91 91234 56789', confidence: 0.97}
      - {type: email, value: priya.nair@example.org}
      - {type: pan, value: ABCPN1234K, confidence: 0.97}
      - {type: upi_id, value: priya.n@oksbi, confidence: 0.99}
      - {type: bank_account, value: '50100987654321', confidence: 0.97}
      - {type: ifsc, value: HDFC0004567, confidence: 0.98}
      - {type: address, value: 'House No 7, Civil Lines, Jaipur 302006'}
  - id: hindi-record
    text: 'नाम: पूजा यादव; मोबाइल 9468451273; पता: मकान 185, शिवाजी पार्क, इंदौर 452001'
    expect:
      - {type: person_name, value: पूजा यादव}
      - {type: mobile_in, value: '9468451273', confidence: 0.93}
      - {type: address, value: 'मकान 185, शिवाजी पार्क, इंदौर 452001'}

  # --- Context: the stronger cue wins -------------------------------------
  - id: nearer-context-beats-farther-negative
    text: 'Caller gave Aadhaar 542229371182 for e-KYC; order 51966'
    expect:
      - {type: aadhaar, value: '542229371182', confidence: 0.97,
         reason: "farther negative context 'order' ignored"}
  - id: nearer-negative-beats-farther-context
    text: 'Aadhaar check: order 542229371182'
    expect:
      - {type: aadhaar, value: '542229371182', confidence: 0.48,
         reason: "negative context 'order'"}
  - id: label-before-value-beats-label-of-next-item
    # "Aadhaar" labels the second number, not the first.
    text: 'order no 878245671885, Aadhaar 542229371182'
    expect:
      - {type: aadhaar, value: '878245671885', confidence: 0.48,
         reason: "negative context 'order'"}
      - {type: aadhaar, value: '542229371182', confidence: 0.97}
  - id: context-distance-counts-from-whole-word
    text: 'Verified mobile 08355376125. Ticket B81742.'
    expect:
      - {type: mobile_in, value: '08355376125', confidence: 0.97,
         reason: "farther negative context 'Ticket' ignored"}

  # --- Bank accounts and voter IDs without labels --------------------------
  - id: ifsc-next-to-account-number
    text: 'LQN0147194|581643357870332137|UTIB0662682'
    expect:
      - {type: voter_epic, value: LQN0147194, confidence: 0.3}
      - {type: bank_account, value: '581643357870332137', confidence: 0.97,
         reason: "context 'UTIB0662682'"}
      - {type: ifsc, value: UTIB0662682}
  - id: ifsc-does-not-turn-a-mobile-into-an-account
    text: 'mobile 9876543210, IFSC HDFC0001234'
    expect:
      - {type: mobile_in, value: '9876543210', confidence: 0.93}
      - {type: ifsc, value: HDFC0001234, confidence: 0.98}

  # --- Names with "ji" -----------------------------------------------------
  - id: name-before-ji
    text: 'Subhash Verma ji ka number 9876543210 hai'
    expect:
      - {type: person_name, value: Subhash Verma, confidence: 0.8}
      - {type: mobile_in, value: '9876543210', confidence: 0.65}
  - id: greeting-before-name-ji
    text: 'Namaste Sharma ji'
    expect:
      - {type: person_name, value: Sharma}
  - id: name-before-ji-devanagari
    text: 'सुनीता जी का फोन आया'
    expect:
      - {type: person_name, value: सुनीता}

  # --- Names in mixed scripts ----------------------------------------------
  - id: latin-honorific-devanagari-name
    text: 'Smt. सुनीता देवी, mobile 9468451273'
    expect:
      - {type: person_name, value: सुनीता देवी, confidence: 0.8}
      - {type: mobile_in, value: '9468451273', confidence: 0.93}
  - id: latin-label-devanagari-name-is-not-cut
    # A vowel sign is a mark, not a letter: the whole name is kept.
    text: 'Name: सुनीता देवी'
    expect:
      - {type: person_name, value: सुनीता देवी}
  - id: latin-relation-devanagari-name
    text: 'S/o रामेश्वर प्रसाद'
    expect:
      - {type: person_name, value: रामेश्वर प्रसाद}
  - id: devanagari-honorific-latin-name
    text: 'श्री Ramesh Kumar'
    expect:
      - {type: person_name, value: Ramesh Kumar}
  - id: devanagari-label-latin-name
    text: 'नाम: Priya Nair'
    expect:
      - {type: person_name, value: Priya Nair}

  # --- CKYC, ration card, NREGA job card -----------------------------------
  - id: ckyc-with-cue
    text: 'CKYC No: 50000012345678'
    expect:
      - {type: ckyc, value: '50000012345678', confidence: 0.97}
  - id: ckyc-kin-cue
    text: 'KIN 50000012345678 verified'
    expect:
      - {type: ckyc, value: '50000012345678', confidence: 0.97}
  - id: ration-card-after-label
    text: 'Ration card no: MH1234567890'
    expect:
      - {type: ration_card, value: MH1234567890, confidence: 0.9}
  - id: ration-card-hindi-label
    text: 'राशन कार्ड संख्या 123456789012'
    expect:
      - {type: ration_card, value: '123456789012', confidence: 0.9}
  - id: nrega-job-card-with-cue
    text: 'Job card UP-12-005-021-001/123'
    expect:
      - {type: nrega_job_card, value: UP-12-005-021-001/123, confidence: 0.97}
  - id: nrega-job-card-without-cue
    text: 'household KN-05-002-001-001/45 listed'
    expect:
      - {type: nrega_job_card, value: KN-05-002-001-001/45, confidence: 0.6}

  # --- Card verification code and expiry -----------------------------------
  - id: card-with-expiry-and-cvv
    text: 'Card 4111 1111 1111 1111 exp 12/27 CVV 123'
    expect:
      - {type: card, value: '4111 1111 1111 1111'}
      - {type: card_expiry, value: 12/27, confidence: 0.97}
      - {type: card_cvv, value: '123', confidence: 0.9}
  - id: expiry-year-is-not-a-cvv
    text: 'Visa 4111111111111111, expiry 03/2028, cvv: 4321'
    expect:
      - {type: card, value: '4111111111111111'}
      - {type: card_expiry, value: 03/2028}
      - {type: card_cvv, value: '4321'}
  - id: cvv-label-variants
    text: 'CVV2-482; security code 777; सीवीवी 905'
    expect:
      - {type: card_cvv, value: '482'}
      - {type: card_cvv, value: '777'}
      - {type: card_cvv, value: '905'}

