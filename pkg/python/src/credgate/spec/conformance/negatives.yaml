# Hard negatives: text that is not PII (or not the PII it resembles). Every
# CredGate implementation must report no match with confidence at or above
# `max_confidence` (default 0.5) for these. Low-confidence matches are
# allowed: they are reported so that callers can decide, and
# `min_confidence` filters them out.
#
# `known_false_positives` documents current limits: text that is still
# detected although it is not PII. Tests assert that each one still occurs,
# so a fix is noticed and the case moves to `negatives`.
#
# All values are synthetic.

spec_version: 1

