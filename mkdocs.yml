# The documentation site: this MkDocs site (home, Python, guides, spec) with
# the R package's pkgdown site under r/. Built with Nix (`nix build .#docs`)
# and published to GitHub Pages by .github/workflows/docs.yml.
site_name: credgate
site_description: Keep Aadhaar, PAN and other Indian personal data out of LLM prompts - detection, a policy proxy for Claude Code, Copilot and Ollama, and an audit log. R and Python.
site_url: https://dwarpal.github.io/credgate/
repo_url: https://github.com/dwarpal/credgate
repo_name: dwarpal/credgate
edit_uri: edit/main/docs/
copyright: Copyright 2026 Bharat Sikka and Aishwarya Bais - Apache-2.0

theme:
  name: material
  # No web fonts: the site works offline and loads nothing from third parties.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Python:
      - Get started: python/index.md
      - "API: detection": python/api/detection.md
      - "API: redaction and tokens": python/api/redaction.md
      - "API: inventory and discovery": python/api/inventory.md
      - "API: policies and audit log": python/api/policies.md
      - "API: integrations": python/api/integrations.md
      - "API: proxy": python/api/proxy.md
      - "API: evaluation and test data": python/api/evaluation.md
  - R: https://dwarpal.github.io/credgate/r/
  - How it works: how-it-works.md
  - Features in detail: features.md
  - Guides:
      - Proxy: proxy.md
      - Policy editor: policy-editor.md
      - Deployment: deployment.md
      - Custom detectors: custom-detectors.md
      - Large data: large-data.md
      - Threat model: threat-model.md
  - R and Python: r-and-python.md
  - Licences: licences.md
  - Specification: spec.md
  - Blog:
      - blog/index.md

plugins:
  - search
  # Posts are Markdown files in docs/blog/posts/, reviewed in pull requests
  # like everything else. A post with `draft: true` is shown by `mkdocs serve`
  # but not published.
  - blog:
      blog_toc: true
      post_url_format: "{slug}"
      post_date_format: long
      archive: false
  # RSS feeds (blog/feed_rss_created.xml) for R-bloggers, R Weekly and
  # readers. Dates come from each post's front matter: the build has no git
  # history.
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date.created
      use_git: false
      categories:
        - categories
      abstract_chars_count: 400
  # The R posts alone, in full, for R-bloggers and R Weekly (they take only
  # R content, and the whole post): blog/feed_rss_created_r.xml.
  - rss:
      match_path: "blog/posts/r/.*"
      date_from_meta:
        as_creation: date.created
      use_git: false
      categories:
        - categories
      abstract_chars_count: -1
      feed_title: "credgate - R posts"
      feed_description: "Posts about the credgate R package: detecting and protecting Indian personal data in R."
      feeds_filenames:
        json_created: feed_json_created_r.json
        json_updated: feed_json_updated_r.json
        rss_created: feed_rss_created_r.xml
        rss_updated: feed_rss_updated_r.xml
  - mkdocstrings:
      handlers:
        python:
          paths: [pkg/python/src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

validation:
  # Guides link to files elsewhere in the repository (benchmark/, examples/).
  unrecognized_links: info
